ģisks breakbeat, house, hiphopa, funk un rokmūzikas sakausējums. 1996. gadā izdotajam debijas albumam “Better Living Through Chemistry” sekoja “You’ve Come a Long Way, Baby”, kas viņu ierindoja starp sava laika pieprasītākajiem producentiem un dīdžejiem. Tajā iekļautie “The Rockafeller Skank” un “Praise You” kļuva par 90. gadu deju mūzikas klasiku, savukārt Spike Jonze režisētais “Praise You” videoklips ar šķietami nejaušu dejotāju grupu iepretim kinoteātrim kļuva par vienu no sava laikmeta atpazīstamākajiem mūzikas video.Panākumiem sekoja arī virkne spilgtu sadarbību. Albumā “Halfway Between the Gutter and the Stars” Fatboy Slim strādāja kopā ar funk leģendu Bootsy Collins, kura vokāls dzirdams “Weapon of Choice”, un neatkārtojamās balss īpašnieci Macy Gray dziesmā “Demons”. Savukārt viņa veidotais Cornershop “Brimful of Asha” remikss oriģinālo indie ierakstu pārvērta par deju grīdas hitu, kas sasniedza Apvienotās Karalistes singlu topa pirmo vietu.Fatboy Slim nekad nav centies elektronisko mūziku padarīt pārlieku nopietnu. Pats savu skanējumu viņš reiz raksturojis kā “party acid house”, un arī viņa DJ setos house un techno brīvi sadzīvo ar funk, hiphopu, roku, negaidītiem sampliem un popkultūras fragmentiem. Arī vizuāli viņa šovi jau sen pārsnieguši tradicionāla DJ seta robežas – mūziku papildina īpaši veidotas un ar to sinhronizētas videoprojekcijas, kuru dēļ Fatboy Slim sevi savulaik jokojot nodēvēja par “video jockey”.Arī šodien, vairāk nekā trīsdesmit gadus pēc izlaušanās pasaules mūzikas apritē, Fatboy Slim turpina aktīvi koncertēt un pulcēt vairākas klausītāju paaudzes un 20. novembrī to būs iespējams piedzīvot tepat Rīgā! VAKARA PLĀNS: 20:00 | Ieeja pasākumā21:00 | MAKREE23:00 | Fatboy Slim AFTERPARTY:Pēc Fatboy Slim DJ seta – Palladium 2. stāva bārā ar DJ MAKREE","name":"Fatboy Slim - Crave Night @ Palladium - Biļešu Serviss","url":"https://www.bilesuserviss.lv/biletes/WAHYBEP5O7/fatboy-slim-crave-night-palladium","isPartOf":{"@id":"https://www.bilesuservi
