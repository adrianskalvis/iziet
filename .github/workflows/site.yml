name: Site

# One workflow for the live site:
# - push to main: build with the committed data and deploy to GitHub Pages.
# - every 6 hours (and by hand): fetch fresh events first, deploy, then commit the data.
# Scraping runs in a read-only job without stored git credentials; only the
# commit job can write, and it copies JSON files only.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Raw source results stay out of the public repo; the Actions cache keeps
      # them between runs so a failing source can fall back to its last result.
      - uses: actions/cache@v4
        with:
          path: data/cache/sources
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - name: Fetch and normalise events
        run: npm run data
        env:
          # Sources that need written permission stay off until a repository variable is set to "1".
          SOURCE_BILESUSERVISS: ${{ vars.SOURCE_BILESUSERVISS }}
          SOURCE_LATVIATRAVEL: ${{ vars.SOURCE_LATVIATRAVEL }}
          SOURCE_TICKETSHOP: ${{ vars.SOURCE_TICKETSHOP }}
          SOURCE_NICHE_BLUSA: ${{ vars.SOURCE_NICHE_BLUSA }}
      - name: Unit tests
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: event-data
          path: static/data
          retention-days: 3

  build:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: needs.data.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: event-data
          path: artifact
      - name: Use fresh data
        if: needs.data.result == 'success'
        run: rsync -a --include='*/' --include='*.json' --exclude='*' artifact/ static/data/
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  commit-data:
    needs: [data, deploy]
    if: always() && needs.data.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: event-data
          path: artifact
      - name: Copy only JSON data into the tree
        run: |
          rsync -a --delete --include='*/' --include='*.json' --exclude='*' artifact/ static/data/
      - name: Commit data
        run: |
          git config user.name "iziet-data-bot"
          git config user.email "iziet-data-bot@users.noreply.github.com"
          git add static/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh event data"
            git push
          fi
