name: Site

# One workflow for the live site:
# - every 6 hours (and by hand): fetch fresh events, deploy, then commit the data.
# - push to main: rebuild the data from the cached source results with the new
#   code, then deploy. A code push therefore never puts older events back online.
# Scraping runs in a read-only job without stored git credentials; only the
# commit job can write, and it copies JSON files only.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Refresh only these source ids (comma-separated); the others reuse their cached result
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Raw source results stay out of the public repo; the Actions cache keeps
      # them between runs so a failing source can fall back to its last result.
      - uses: actions/cache@v6
        with:
          path: data/cache/sources
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      # Sources that refuse GitHub's servers arrive through the "relay" release,
      # uploaded from the owner's computer by scripts/relay.sh. They are used
      # only when the live fetch here fails and the file is under 7 days old.
      - name: Download relay data
        run: gh release download relay --dir data/relay --pattern '*.json' --clobber || echo "No relay data"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Fetch and normalise events
        run: npm run data -- ${ONLY:+"--only=$ONLY"}
        env:
          # On a push no source is fetched: "none" matches no source id, so every source replays its cached result.
          ONLY: ${{ github.event_name == 'push' && 'none' || inputs.only }}
          # Sources that need written permission stay off until a repository variable is set to "1".
          SOURCE_BILESUSERVISS: ${{ vars.SOURCE_BILESUSERVISS }}
          SOURCE_LATVIATRAVEL: ${{ vars.SOURCE_LATVIATRAVEL }}
          SOURCE_TICKETSHOP: ${{ vars.SOURCE_TICKETSHOP }}
          SOURCE_NICHE_BLUSA: ${{ vars.SOURCE_NICHE_BLUSA }}
      - name: Unit tests
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: event-data
          path: static/data
          retention-days: 3
      # Text only: which sources have had no fresh events for days (pipeline/health.ts).
      # The health job below, which may write issues, reads this file and runs no project code.
      - name: Write the source health report
        run: |
          mkdir -p health
          npx tsx pipeline/health-run.ts > health/health.md
          if [ -s health/health.md ]; then echo stale > health/status.txt; else echo fresh > health/status.txt; fi
      - uses: actions/upload-artifact@v7
        with:
          name: source-health
          path: health
          retention-days: 3

  build:
    needs: data
    # A push still deploys its code when the data job fails; it then uses the committed data.
    if: always() && (needs.data.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: needs.data.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: event-data
          path: artifact
      - name: Use fresh data
        if: needs.data.result == 'success'
        run: rsync -a --include='*/' --include='*.json' --exclude='*' artifact/ static/data/
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # One issue tells the owner when something needs a human: it opens when a source
  # goes stale, updates while it stays stale and closes when every source is back.
  health:
    needs: data
    if: always() && needs.data.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-health
          path: health
      - name: Open, update or close the source health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --label source-health --json number --jq '.[0].number // empty')
          if [ -s health/health.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file health/health.md
            else
              gh label create source-health --color B60205 --description "Opened by the data run when a source goes stale" --force
              gh issue create --title "Event sources need attention" --label source-health --body-file health/health.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All sources are fresh again."
          fi

  commit-data:
    needs: [data, deploy]
    if: always() && needs.data.result == 'success' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: event-data
          path: artifact
      - name: Copy only JSON data into the tree
        run: |
          rsync -a --delete --include='*/' --include='*.json' --exclude='*' artifact/ static/data/
      - name: Commit data
        run: |
          git config user.name "iziet-data-bot"
          git config user.email "iziet-data-bot@users.noreply.github.com"
          git add static/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh event data"
            # A code push may land while the data run is busy: replay the data commit on top and try again.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase
            done
            exit 1
          fi
