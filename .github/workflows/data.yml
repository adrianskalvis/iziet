name: Refresh events

# Two jobs: "fetch" parses untrusted web pages with read-only permissions and no
# stored git credentials; "commit" only takes the generated files and pushes them.
# Cloudflare Pages rebuilds the site on that push.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and normalise events
        run: npm run data
        env:
          # Sources that need written permission stay off until a repository variable is set to "1".
          SOURCE_BILESUSERVISS: ${{ vars.SOURCE_BILESUSERVISS }}
          SOURCE_LATVIATRAVEL: ${{ vars.SOURCE_LATVIATRAVEL }}
          SOURCE_TICKETSHOP: ${{ vars.SOURCE_TICKETSHOP }}
          SOURCE_NICHE_BLUSA: ${{ vars.SOURCE_NICHE_BLUSA }}
      - name: Unit tests
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: event-data
          path: |
            static/data
            data/cache/sources
          retention-days: 3

  commit:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: event-data
          path: artifact
      - name: Copy only JSON data into the tree
        run: |
          rsync -a --delete --include='*/' --include='*.json' --exclude='*' artifact/static/data/ static/data/
          rsync -a --delete --include='*.json' --exclude='*' artifact/data/cache/sources/ data/cache/sources/
      - name: Commit data
        run: |
          git config user.name "iziet-data-bot"
          git config user.email "iziet-data-bot@users.noreply.github.com"
          git add static/data data/cache/sources
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh event data"
            git push
          fi
