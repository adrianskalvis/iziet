<!doctype html>
<html lang="lv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Atrodi pasākumu tuvumā 30 sekundēs: koncerti, tirdziņi, izstādes, sports un vēl." />
		<meta name="theme-color" content="#ECD8C0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1B1814" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			// Runs before first paint: text size and first-visit state from the saved profile.
			try {
				var raw = localStorage.getItem('iziet.profile.v1');
				var profile = raw ? JSON.parse(raw) : null;
				if (!profile || !profile.onboarded) document.documentElement.classList.add('first-visit');
				if (profile && profile.textSize === 'large') document.documentElement.classList.add('text-large');
			} catch (e) {
				document.documentElement.classList.add('first-visit');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
